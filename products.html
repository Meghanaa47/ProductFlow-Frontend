<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ProductFlow | Products</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            ProductFlow
        </div>

        <nav>
            <a href="index.html">
                Dashboard
            </a>

            <a href="products.html" class="active">
                Products
            </a>

            <a href="add-product.html">
                Add Product
            </a>
        </nav>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <!-- Header -->
        <header class="topbar">

            <div>
                <h1>Products</h1>
                <p>Manage your product inventory</p>
            </div>

            <a href="add-product.html" class="add-btn">
                + Add Product
            </a>

        </header>


        <!-- Search and Filters -->
        <section class="filter-card">

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by name or category..."
                >

                <button onclick="searchProduct()">
                    Search
                </button>

            </div>


            <div class="price-filter">

                <input
                    type="number"
                    id="minPrice"
                    placeholder="Min price"
                >

                <input
                    type="number"
                    id="maxPrice"
                    placeholder="Max price"
                >

                <button onclick="filterByPrice()">
                    Filter
                </button>

                <button
                    onclick="loadProducts()"
                    class="secondary-btn">
                    Reset
                </button>

            </div>


            <!-- Sorting -->
            <div class="sort-box">

                <label for="sortSelect">
                    Sort By
                </label>

                <select
                    id="sortSelect"
                    onchange="sortProducts()">

                    <option value="">
                        Default
                    </option>

                    <option value="name-asc">
                        Name: A → Z
                    </option>

                    <option value="name-desc">
                        Name: Z → A
                    </option>

                    <option value="price-asc">
                        Price: Low → High
                    </option>

                    <option value="price-desc">
                        Price: High → Low
                    </option>

                    <option value="id-desc">
                        Recently Added
                    </option>

                </select>

            </div>

        </section>


        <!-- Products Table -->
        <section class="dashboard-card">

            <div class="card-header product-header">

                <h2>Product List</h2>

                <span id="productCount">
                    0 products
                </span>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>

                    </thead>


                    <tbody id="productTableBody">

                        <tr>
                            <td colspan="5">
                                Loading products...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- Delete Confirmation Modal -->

    <div id="deleteModal" class="modal">

        <div class="modal-content">

            <h2>Delete Product?</h2>

            <p>
                Are you sure you want to delete this product?
            </p>

            <div class="modal-actions">

                <button
                    id="cancelDelete"
                    class="cancel-btn">
                    Cancel
                </button>

                <button
                    id="confirmDelete"
                    class="delete-confirm-btn">
                    Delete
                </button>

            </div>

        </div>

    </div>


    <script src="js/api.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/products.js"></script>

</body>
</html>
