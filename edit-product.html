<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ProductFlow | Edit Product</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            ProductFlow
        </div>

        <nav>

            <a href="index.html">
                Dashboard
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="add-product.html">
                Add Product
            </a>

        </nav>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Edit Product</h1>
                <p>Update product information</p>
            </div>

        </header>


        <section class="form-card">

            <form id="editProductForm">

                <div class="form-group">

                    <label for="name">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter product name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="price">
                        Price
                    </label>

                    <input
                        type="number"
                        id="price"
                        placeholder="Enter product price"
                        min="0"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <input
                        type="text"
                        id="category"
                        placeholder="Enter product category"
                        required
                    >

                </div>


                <div class="form-actions">

                    <a
                        href="products.html"
                        class="cancel-btn">
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="submit-btn">
                        Update Product
                    </button>

                </div>

            </form>

        </section>

    </main>


    <script src="js/api.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/edit-product.js"></script>
</body>
</html>
